<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lot Full — 24x36 Poster</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  @page { size: 24in 36in; margin: 0; }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --pink:#F65472; --blue:#69CFED; --green:#8CC63E;
    --yellow:#FFD93D; --cream:#FFFDF5; --ink:#1A1A2E; --ink-soft:#4a4a5a;
    --band:5.15in;              /* reserved height of the volunteer band */
  }

  html, body { width:24in; height:36in; }
  body {
    font-family:'Nunito', sans-serif; color:var(--ink);
    background:var(--cream); -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }

  .sheet {
    width:24in; height:36in; position:relative; overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    padding:1in 1.15in calc(var(--band) + .45in);
  }

  .blob { position:absolute; border-radius:50%; opacity:.16; }
  .b1 { width:7.5in; height:7.5in; background:var(--blue);   top:-2.7in;   left:-2.5in; }
  .b2 { width:6in;   height:6in;   background:var(--yellow); top:1in;      right:-2.3in; }
  .b3 { width:5in;   height:5in;   background:var(--green);  bottom:5.6in; left:-2.2in; }

  .logo { width:10.2in; height:auto; display:block; position:relative; z-index:2; }

  h1 {
    position:relative; z-index:2;
    font-family:'Baloo 2', cursive; font-weight:800;
    font-size:5.35in; line-height:.82; letter-spacing:-.02em;
    color:var(--ink); text-align:center; margin-top:.85in;
  }

  .sub {
    position:relative; z-index:2;
    font-size:1.12in; line-height:1.28; font-weight:700;
    text-align:center; color:var(--ink-soft);
    margin-top:.6in; max-width:19.5in;
  }
  .sub strong { color:var(--ink); font-weight:900; }

  .scan {
    position:relative; z-index:2; margin-top:.6in;
    background:#fff; border-radius:.7in;
    border:.1in solid var(--ink);
    padding:.5in .62in;
    display:flex; align-items:center; gap:.7in;
    box-shadow:0 .14in .45in rgba(0,0,0,.09);
  }
  .qr { width:5.9in; height:5.9in; display:block; flex-shrink:0; }
  .scan-copy { text-align:left; }
  .scan-copy .big {
    font-family:'Baloo 2', cursive; font-weight:800;
    font-size:1.4in; line-height:1.0; color:var(--ink);
  }
  .scan-copy .small {
    font-size:.72in; font-weight:700; color:var(--ink-soft);
    margin-top:.16in; line-height:1.28;
  }
  .scan-copy .url {
    font-family:'Baloo 2', cursive; font-weight:700;
    font-size:.5in; color:var(--pink); margin-top:.24in;
  }

  .vol {
    position:absolute; left:0; right:0; bottom:0; z-index:3;
    height:var(--band);
    background:var(--green); color:#fff;
    padding:.62in 1.1in; text-align:center;
    display:flex; flex-direction:column; justify-content:center;
  }
  .vol .tag {
    font-family:'Baloo 2', cursive; font-weight:800;
    font-size:.58in; letter-spacing:.1em; text-transform:uppercase; opacity:.93;
  }
  .vol .addr {
    font-family:'Baloo 2', cursive; font-weight:800;
    font-size:1.16in; line-height:1.14; margin-top:.1in;
  }
  .vol .meta { font-size:.58in; font-weight:700; margin-top:.18in; opacity:.95; }
</style>
</head>
<body>
<div class="sheet">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <img class="logo" src="../logo.svg" alt="Madison Good Neighbor Gathering">

  <h1>LOT<br>FULL</h1>
