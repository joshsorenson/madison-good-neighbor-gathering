<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>GNG 2026 – Live Music & Performances</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
  }
  .canvas {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    position: relative;
  }

  /* Full-bleed photo */
  .photo-bg {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .photo-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
    display: block;
  }

  /* Gradient overlays */
  .overlay-top {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: linear-gradient(
      to bottom,
      rgba(26,26,46,0.72) 0%,
      rgba(26,26,46,0.20) 30%,
      rgba(26,26,46,0.10) 45%,
      rgba(26,26,46,0.55) 65%,
      rgba(26,26,46,0.92) 85%,
      rgba(26,26,46,0.98) 100%
    );
  }

  /* Warm tint layer */
  .tint {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: rgba(240,127,27,0.08);
  }

  /* Content */
  .content {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 44px 48px 48px;
  }

  /* Top badge */
  .top-badge {
    background: linear-gradient(135deg, #F07F1B, #F65472);
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 22px;
    padding: 12px 32px;
    border-radius: 50px;
    letter-spacing: 0.03em;
    box-shadow: 0 6px 24px rgba(240,127,27,0.4);
    margin-bottom: 0;
  }

  /* From badge */
  .from-badge {
    position: absolute;
    top: 44px;
    right: 44px;
    background: rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.65);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.18);
  }

  .flex-spacer { flex: 1; }

  /* Central content block */
  .center-block {
    text-align: center;
    margin-bottom: 28px;
  }

  .big-headline {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 62px;
    color: #fff;
    line-height: 1.05;
    text-align: center;
    margin-bottom: 10px;
    text-shadow: 0 3px 20px rgba(0,0,0,0.5);
    letter-spacing: -0.01em;
  }
  .big-headline span {
    color: #FFDE59;
  }

  .sub-headline {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 26px;
    color: rgba(255,255,255,0.75);
    text-align: center;
    letter-spacing: 0.01em;
    margin-bottom: 28px;
  }

  /* Logo */
  .logo-wrap {
    margin-bottom: 32px;
    text-align: center;
  }
  .logo-wrap img {
    height: 76px;
    width: auto;
    filter: brightness(0) invert(1);
  }

  /* Performance pills row */
  .perf-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 28px;
  }
  .perf-pill {
    padding: 10px 22px;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 19px;
    letter-spacing: 0.01em;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  }
  .p1 { background: #F65472; color: #fff; }
  .p2 { background: #3DAAC8; color: #fff; }
  .p3 { background: #8CC63E; color: #fff; }
  .p4 { background: #F07F1B; color: #fff; }
  .p5 { background: #FFDE59; color: #1A1A2E; }

  /* Bottom bar */
  .bottom-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .date-chip {
    background: rgba(255,255,255,0.14);
    border: 1.5px solid rgba(255,255,255,0.25);
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 20px;
    padding: 10px 26px;
    border-radius: 50px;
    backdrop-filter: blur(8px);
  }
  .free-chip {
    background: #8CC63E;
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 20px;
    padding: 10px 26px;
    border-radius: 50px;
    box-shadow: 0 4px 16px rgba(140,198,62,0.35);
  }
  .website {
    color: rgba(255,255,255,0.45);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="photo-bg">
    <img src="../photos/taiko-closeup.jpg" alt="Taiko drumming performance">
  </div>
  <div class="overlay-top"></div>
  <div class="tint"></div>

  <div class="from-badge">From Last Year</div>

  <div class="content">
    <div class="top-badge">🎵 Live Music &amp; Performances</div>

    <div class="flex-spacer"></div>

    <div class="center-block">
      <div class="big-headline">Experience Madison's<br><span>most diverse stage</span></div>
      <div class="sub-headline">Every beat. Every culture. One afternoon.</div>
    </div>

    <div class="logo-wrap">
      <img src="../logo.svg" alt="Madison Good Neighbor Gathering">
    </div>

    <div class="perf-row">
      <div class="perf-pill p1">🥁 Taiko</div>
      <div class="perf-pill p2">💃 Ballet Folklórico</div>
      <div class="perf-pill p3">🪭 Hmong Dance</div>
      <div class="perf-pill p4">🦅 Native Dance</div>
      <div class="perf-pill p5">🎸 Live Guitar</div>
    </div>

    <div class="bottom-bar">
      <div class="date-chip">📅 September 13, 2026</div>
      <div class="free-chip">FREE Admission</div>
      <div class="website">madisongoodneighborgathering.org</div>
    </div>
  </div>
</div>
</body>
</html>
