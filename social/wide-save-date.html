<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>GNG 2026 – Facebook Save the Date</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    background: #1A1A2E;
  }
  .canvas {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    display: flex;
  }

  /* Left content panel */
  .left-panel {
    width: 520px;
    flex-shrink: 0;
    background: #1A1A2E;
    height: 630px;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 44px 48px;
    overflow: hidden;
  }

  /* Decorative dots on left panel */
  .panel-dot {
    position: absolute;
    border-radius: 50%;
  }

  /* Right photo */
  .right-photo {
    flex: 1;
    height: 630px;
    position: relative;
    overflow: hidden;
  }
  .right-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 40%;
    display: block;
  }

  /* Gradient fade left edge of photo */
  .photo-fade-left {
    position: absolute;
    top: 0;
    left: 0;
    width: 280px;
    height: 100%;
    background: linear-gradient(to right, #1A1A2E 0%, rgba(26,26,46,0.80) 40%, transparent 100%);
    z-index: 2;
  }

  /* FREE badge on photo */
  .free-badge {
    position: absolute;
    bottom: 32px;
    right: 28px;
    z-index: 5;
    background: #8CC63E;
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 22px;
    padding: 12px 28px;
    border-radius: 50px;
    box-shadow: 0 6px 24px rgba(140,198,62,0.45);
    letter-spacing: 0.04em;
  }

  /* From badge */
  .from-badge {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 10;
    background: rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.55);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.15);
  }

  /* Left panel content */
  .logo-wrap {
    margin-bottom: 20px;
  }
  .logo-wrap img {
    height: 72px;
    width: auto;
    filter: brightness(0) invert(1);
  }

  .save-label {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 15px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.20em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .big-date {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 72px;
    color: #FFDE59;
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  .year-sub {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 36px;
    color: rgba(255,222,89,0.55);
    margin-bottom: 20px;
  }

  /* Divider rule */
  .rule {
    width: 60px;
    height: 3px;
    background: linear-gradient(to right, #F65472, #F07F1B);
    border-radius: 2px;
    margin-bottom: 18px;
  }

  .location-text {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: rgba(255,255,255,0.75);
    margin-bottom: 6px;
  }
  .time-text {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 24px;
    letter-spacing: 0.01em;
  }

  /* Detail pills */
  .detail-pills {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }
  .detail-row-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 17px;
    color: rgba(255,255,255,0.65);
  }
  .det-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .di-1 { background: #F65472; }
  .di-2 { background: #F07F1B; }
  .di-3 { background: #3DAAC8; }

  .website {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: rgba(255,255,255,0.32);
    letter-spacing: 0.05em;
  }

  /* Decorative scattered dots */
</style>
</head>
<body>
<div class="canvas">

  <!-- Left panel -->
  <div class="left-panel">
    <!-- Decorative dots -->
    <div class="panel-dot" style="top:30px;right:20px;width:80px;height:80px;background:#F65472;opacity:0.10;"></div>
    <div class="panel-dot" style="bottom:40px;left:10px;width:60px;height:60px;background:#3DAAC8;opacity:0.10;"></div>
    <div class="panel-dot" style="top:180px;right:40px;width:14px;height:14px;background:#FFDE59;opacity:0.35;"></div>
    <div class="panel-dot" style="top:220px;right:16px;width:8px;height:8px;background:#8CC63E;opacity:0.45;"></div>
    <div class="panel-dot" style="bottom:100px;right:30px;width:10px;height:10px;background:#F07F1B;opacity:0.40;"></div>

    <div class="logo-wrap">
      <img src="../logo.svg" alt="Madison Good Neighbor Gathering">
    </div>

    <div class="save-label">Save the Date</div>
    <div class="big-date">September<br>13</div>
    <div class="year-sub">2026</div>

    <div class="rule"></div>

    <div class="detail-pills">
      <div class="detail-row-item">
        <div class="det-icon di-1">🕛</div>
        12:00 – 4:00 PM
      </div>
      <div class="detail-row-item">
        <div class="det-icon di-2">📍</div>
        Brittingham Park, Madison WI
      </div>
      <div class="detail-row-item">
        <div class="det-icon di-3">🎉</div>
        100% Free · All Ages Welcome
      </div>
    </div>

    <div class="website">madisongoodneighborgathering.org</div>
  </div>

  <!-- Right photo -->
  <div class="right-photo">
    <img src="../photos/community-dance.jpg" alt="Community dancing">
    <div class="photo-fade-left"></div>
    <div class="from-badge">From Last Year</div>
    <div class="free-badge">🎉 FREE Admission</div>
  </div>

</div>
</body>
</html>
