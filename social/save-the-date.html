<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>GNG 2026 — Save the Date</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; overflow:hidden; font-family:'Nunito',sans-serif; }

  .canvas {
    width:1080px; height:1080px; position:relative; overflow:hidden;
    background:#FFFDF5;
  }

  /* Big colorful corner blobs */
  .blob { position:absolute; border-radius:50%; }
  .b1 { width:480px; height:480px; background:#F65472; top:-160px; left:-120px; opacity:0.9; }
  .b2 { width:420px; height:420px; background:#FFDE59; top:-140px; right:-100px; opacity:0.9; }
  .b3 { width:400px; height:400px; background:#8CC63E; bottom:-140px; left:-100px; opacity:0.9; }
  .b4 { width:460px; height:460px; background:#3DAAC8; bottom:-160px; right:-120px; opacity:0.9; }
  .b5 { width:200px; height:200px; background:#F07F1B; bottom:60px; left:200px; opacity:0.4; filter:blur(40px); }

  .dot { position:absolute; border-radius:50%; }
  .star { position:absolute; color:#1A1A2E; opacity:0.6; }

  .content {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:60px;
    text-align:center;
  }

  .save-label {
    font-family:'Baloo 2',cursive; font-weight:800; font-size:32px;
    color:#1A1A2E; text-transform:uppercase; letter-spacing:0.18em;
    margin-bottom:16px; opacity:0.7;
  }

  .date-block {
    background:#1A1A2E; border-radius:32px;
    padding:36px 70px;
    margin-bottom:36px;
    box-shadow:0 12px 48px rgba(26,26,46,0.25);
  }
  .date-main {
    font-family:'Baloo 2',cursive; font-weight:800; font-size:80px;
    color:#FFDE59; line-height:1; letter-spacing:-0.01em;
  }
  .date-sub {
    font-family:'Baloo 2',cursive; font-weight:700; font-size:32px;
    color:rgba(255,255,255,0.75); margin-top:4px;
  }

  .logo-wrap { margin-bottom:20px; }
  .logo-wrap img { width:500px; height:auto; }

  .details {
    display:flex; gap:20px; justify-content:center; flex-wrap:wrap;
    margin-bottom:20px;
  }
  .detail-pill {
    font-family:'Baloo 2',cursive; font-weight:700; font-size:24px;
    padding:10px 26px; border-radius:50px; color:#fff;
  }
  .dp-1 { background:#F65472; }
  .dp-2 { background:#3DAAC8; }
  .dp-3 { background:#8CC63E; }

  .photo-strip {
    display:flex; gap:10px; width:100%; margin-bottom:20px;
  }
  .photo-strip img {
    flex:1; height:150px; object-fit:cover; border-radius:16px;
    box-shadow:0 4px 24px rgba(26,26,46,0.2);
  }

  .free-line {
    font-family:'Baloo 2',cursive; font-weight:800; font-size:36px;
    color:#1A1A2E;
  }
  .free-line span { color:#F65472; }
</style>
</head>
<body>
<div class="canvas">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
  <div class="blob b5"></div>

  <!-- Dots scattered -->
  <div class="dot" style="width:20px;height:20px;background:#1A1A2E;top:200px;left:100px;opacity:0.25;"></div>
  <div class="dot" style="width:14px;height:14px;background:#1A1A2E;top:260px;right:110px;opacity:0.2;"></div>
  <div class="dot" style="width:18px;height:18px;background:#1A1A2E;bottom:240px;left:130px;opacity:0.2;"></div>
  <div class="dot" style="width:16px;height:16px;background:#1A1A2E;bottom:200px;right:130px;opacity:0.22;"></div>

  <span class="star" style="top:175px;left:175px;font-size:28px;">✦</span>
  <span class="star" style="top:190px;right:185px;font-size:24px;">★</span>
  <span class="star" style="bottom:185px;left:180px;font-size:22px;">★</span>
  <span class="star" style="bottom:175px;right:175px;font-size:26px;">✦</span>

  <div class="content">
    <div class="save-label">📅 Save the Date</div>
    <div class="date-block">
      <div class="date-main">September 13</div>
      <div class="date-sub">Sunday, 2026</div>
    </div>
    <div class="logo-wrap">
      <img src="../logo.svg" alt="Madison Good Neighbor Gathering">
    </div>
    <div class="details">
      <div class="detail-pill dp-1">⏰ 12 – 4 PM</div>
      <div class="detail-pill dp-2">🌿 Brittingham Park</div>
      <div class="detail-pill dp-3">🏙️ Madison, WI</div>
    </div>
    <div class="photo-strip">
      <img src="../photos/joy.jpg" alt="Joy at the festival">
      <img src="../photos/taiko-group.jpg" alt="Taiko drumming performance">
      <img src="../photos/community-dance.jpg" alt="Community dancing">
    </div>
    <div class="free-line">Live Music · Food Trucks · Kids Activities · <span>100% Free!</span></div>
  </div>
</div>
</body>
</html>
