<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>GNG 2026 — Wide Post</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; font-family:'Nunito',sans-serif; }

  .canvas {
    width:1200px; height:630px; position:relative; overflow:hidden;
    background: linear-gradient(125deg, #1A1A2E 0%, #2d1060 100%);
  }

  .blob { position:absolute; border-radius:50%; opacity:0.2; }
  .b1 { width:500px; height:500px; background:#F65472; top:-180px; left:-100px; }
  .b2 { width:400px; height:400px; background:#F07F1B; bottom:-160px; right:-80px; }
  .b3 { width:280px; height:280px; background:#8CC63E; bottom:-60px; left:350px; opacity:0.15; }

  .dot { position:absolute; border-radius:50%; }
  .star { position:absolute; font-size:24px; opacity:0.85; color:#FFDE59; }

  /* Layout: left = logo + tagline, right = details */
  .left {
    position:absolute; left:0; top:0; bottom:0; width:580px;
    display:flex; flex-direction:column; justify-content:center;
    padding:60px 50px 60px 70px;
  }

  .badge {
    display:inline-flex; align-items:center; gap:8px;
    background:#8CC63E; color:#fff;
    font-family:'Baloo 2',cursive; font-weight:800; font-size:20px;
    padding:7px 20px; border-radius:50px;
    margin-bottom:24px; align-self:flex-start;
    box-shadow:0 4px 16px rgba(140,198,62,0.4);
  }

  .logo-wrap { margin-bottom:20px; }
  .logo-wrap img { width:420px; height:auto; filter:drop-shadow(0 4px 20px rgba(0,0,0,0.4)); }

  .tagline {
    font-family:'Baloo 2',cursive; font-weight:700; font-size:24px;
    color:rgba(255,255,255,0.75); line-height:1.4;
    max-width:460px;
  }

  /* Divider */
  .divider {
    position:absolute; left:560px; top:60px; bottom:60px; width:2px;
    background:linear-gradient(to bottom, transparent, rgba(255,255,255,0.15) 30%, rgba(255,255,255,0.15) 70%, transparent);
  }

  /* Right side */
  .right {
    position:absolute; right:0; top:0; bottom:0; width:620px;
    display:flex; flex-direction:column; justify-content:center;
    padding:50px 70px 50px 60px; gap:18px;
  }

  .detail-row {
    display:flex; align-items:center; gap:18px;
  }
  .detail-icon {
    width:64px; height:64px; border-radius:16px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:30px;
  }
  .di-pink   { background:#F65472; box-shadow:0 4px 16px rgba(246,84,114,0.4); }
  .di-teal   { background:#3DAAC8; box-shadow:0 4px 16px rgba(61,170,200,0.4); }
  .di-green  { background:#8CC63E; box-shadow:0 4px 16px rgba(140,198,62,0.4); }
  .di-yellow { background:#FFDE59; box-shadow:0 4px 16px rgba(255,222,89,0.4); }

  .detail-text {}
  .detail-label {
    font-family:'Nunito',sans-serif; font-weight:800; font-size:15px;
    color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:0.08em;
  }
  .detail-value {
    font-family:'Baloo 2',cursive; font-weight:800; font-size:28px;
    color:#fff; line-height:1.2;
  }

  .cta-row {
    margin-top:8px; display:flex; align-items:center; gap:20px;
  }
  .cta-pill {
    background:#FFDE59; color:#1A1A2E;
    font-family:'Baloo 2',cursive; font-weight:800; font-size:22px;
    padding:12px 32px; border-radius:50px;
    box-shadow:0 4px 20px rgba(255,222,89,0.45);
  }
  .cta-url {
    font-family:'Nunito',sans-serif; font-weight:800; font-size:18px;
    color:rgba(255,255,255,0.45);
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="dot" style="width:16px;height:16px;background:#FFDE59;top:50px;left:200px;opacity:0.7;"></div>
  <div class="dot" style="width:12px;height:12px;background:#F65472;bottom:70px;left:440px;opacity:0.6;"></div>
  <div class="dot" style="width:14px;height:14px;background:#8CC63E;top:80px;right:220px;opacity:0.65;"></div>
  <div class="dot" style="width:18px;height:18px;background:#F07F1B;bottom:60px;right:280px;opacity:0.6;"></div>

  <span class="star" style="top:40px;left:50px;">✦</span>
  <span class="star" style="top:60px;right:60px;color:#F65472;font-size:20px;">★</span>
  <span class="star" style="bottom:50px;left:60px;font-size:18px;color:#8CC63E;">★</span>
  <span class="star" style="bottom:44px;right:55px;color:#F07F1B;font-size:22px;">✦</span>
  <span class="star" style="top:280px;left:540px;color:rgba(255,255,255,0.3);font-size:16px;">★</span>

  <div class="left">
    <div class="badge">🎉 Free Community Festival</div>
    <div class="logo-wrap">
      <img src="../logo.svg" alt="Madison Good Neighbor Gathering">
    </div>
    <p class="tagline">Your District 13 neighbors are throwing a party — and everyone's invited.</p>
  </div>

  <div class="divider"></div>

  <div class="right">
    <div class="detail-row">
      <div class="detail-icon di-pink">📅</div>
      <div class="detail-text">
        <div class="detail-label">Date</div>
        <div class="detail-value">Sunday, September 13, 2026</div>
      </div>
    </div>
    <div class="detail-row">
      <div class="detail-icon di-teal">⏰</div>
      <div class="detail-text">
        <div class="detail-label">Time</div>
        <div class="detail-value">12:00 – 4:00 PM</div>
      </div>
    </div>
    <div class="detail-row">
      <div class="detail-icon di-green">🌿</div>
      <div class="detail-text">
        <div class="detail-label">Location</div>
        <div class="detail-value">Brittingham Park, Madison WI</div>
      </div>
    </div>
    <div class="detail-row">
      <div class="detail-icon di-yellow">🎊</div>
      <div class="detail-text">
        <div class="detail-label">Admission</div>
        <div class="detail-value">FREE · All Ages Welcome</div>
      </div>
    </div>
    <div class="cta-row">
      <div class="cta-pill">No Tickets Needed!</div>
      <div class="cta-url">madisongoodneighborgathering.org</div>
    </div>
  </div>
</div>
</body>
</html>
