<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>GNG 2026 – Portrait Montage</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    background: #1A1A2E;
  }
  .canvas {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    position: relative;
  }

  /* Asymmetric photo grid: left 460px, right 620px */
  .photo-grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 460px 620px;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 5px;
    z-index: 1;
  }

  /* Left column spans all 3 rows via two cells */
  .cell-left-top {
    grid-column: 1;
    grid-row: 1 / 3;
    overflow: hidden;
    position: relative;
  }
  .cell-left-bottom {
    grid-column: 1;
    grid-row: 3;
    overflow: hidden;
    position: relative;
  }
  .cell-right-1 {
    grid-column: 2;
    grid-row: 1;
    overflow: hidden;
    position: relative;
  }
  .cell-right-2 {
    grid-column: 2;
    grid-row: 2;
    overflow: hidden;
    position: relative;
  }
  .cell-right-3 {
    grid-column: 2;
    grid-row: 3;
    overflow: hidden;
    position: relative;
  }

  .photo-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  /* Colored border strips between columns */
  .col-divider {
    position: absolute;
    top: 0;
    left: 460px;
    width: 5px;
    height: 100%;
    background: linear-gradient(to bottom, #F65472, #FFDE59, #8CC63E, #3DAAC8, #F07F1B);
    z-index: 5;
  }

  /* Dark semi-transparent overlay on all photos */
  .grid-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: rgba(26,26,46,0.28);
  }

  /* Top banner */
  .top-banner {
    position: absolute;
    top: 0;
    left: 0;
    width: 1080px;
    height: 120px;
    background: linear-gradient(to bottom, rgba(26,26,46,0.94) 0%, rgba(26,26,46,0.85) 70%, transparent 100%);
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 0 40px;
  }

  .top-logo img {
    height: 64px;
    width: auto;
    filter: brightness(0) invert(1);
  }

  .year-badge {
    background: #FFDE59;
    color: #1A1A2E;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 24px;
    padding: 7px 20px;
    border-radius: 12px;
    letter-spacing: 0.04em;
    box-shadow: 0 4px 16px rgba(255,222,89,0.4);
  }

  /* Bottom band */
  .bottom-band {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1080px;
    height: 160px;
    background: linear-gradient(to top, rgba(26,26,46,0.97) 0%, rgba(26,26,46,0.90) 70%, transparent 100%);
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 28px;
  }

  .bottom-main {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 38px;
    color: #FFDE59;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
    text-align: center;
  }

  .bottom-details {
    display: flex;
    gap: 20px;
    align-items: center;
    margin-bottom: 8px;
  }

  .bd-item {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: rgba(255,255,255,0.80);
  }

  .bd-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    flex-shrink: 0;
  }

  .bottom-website {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: rgba(255,255,255,0.40);
    letter-spacing: 0.05em;
  }

  /* "From last year" badges on individual photos */
  .photo-badge {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: rgba(26,26,46,0.55);
    color: rgba(255,255,255,0.65);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
    z-index: 4;
    border: 1px solid rgba(255,255,255,0.14);
  }

  /* Corner color accents on cells */
  .cell-accent {
    position: absolute;
    z-index: 3;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="canvas">
  <!-- Photo grid -->
  <div class="photo-grid">
    <div class="cell-left-top">
      <img src="../photos/taiko-closeup.jpg" alt="Taiko drumming" style="object-position: center 25%;">
      <div class="photo-badge">From Last Year</div>
    </div>
    <div class="cell-left-bottom">
      <img src="../photos/kids-crown.jpg" alt="Child with crown" style="object-position: center 30%;">
    </div>
    <div class="cell-right-1">
      <img src="../photos/ballet-folklorico-blue.jpg" alt="Ballet Folklorico" style="object-position: center 20%;">
    </div>
    <div class="cell-right-2">
      <img src="../photos/food-truck.jpg" alt="Food trucks" style="object-position: center 50%;">
    </div>
    <div class="cell-right-3">
      <img src="../photos/community-dance.jpg" alt="Community dancing" style="object-position: center 40%;">
    </div>
  </div>

  <!-- Grid overlay -->
  <div class="grid-overlay"></div>

  <!-- Colored divider strip -->
  <div class="col-divider"></div>

  <!-- Top banner -->
  <div class="top-banner">
    <div class="top-logo">
      <img src="../logo.svg" alt="Madison Good Neighbor Gathering">
    </div>
    <div class="year-badge">2026</div>
  </div>

  <!-- Bottom band -->
  <div class="bottom-band">
    <div class="bottom-main">Good Neighbor Gathering 2026</div>
    <div class="bottom-details">
      <div class="bd-item">📅 September 13, 2026</div>
      <div class="bd-dot"></div>
      <div class="bd-item">📍 Brittingham Park, Madison WI</div>
      <div class="bd-dot"></div>
      <div class="bd-item">🎉 Free</div>
    </div>
    <div class="bottom-website">madisongoodneighborgathering.org</div>
  </div>
</div>
</body>
</html>
