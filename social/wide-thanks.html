<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>GNG 2026 &ndash; Thank You (Wide)</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Nunito', sans-serif; }

  .canvas { position: relative; width: 1200px; height: 630px; overflow: hidden; }

  .photo-bg { position: absolute; inset: 0; z-index: 1; }
  .photo-bg img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 55%;
    display: block;
  }

  /* Darken enough that white type holds up wherever a preview crops it. */
  .overlay {
    position: absolute; inset: 0; z-index: 2;
    background:
      radial-gradient(ellipse at center, rgba(26,26,46,0.58) 0%, rgba(26,26,46,0.72) 55%, rgba(26,26,46,0.86) 100%);
  }

  .stack {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 0 70px;
  }

  .badge {
    width: 200px; height: 200px;
    margin-bottom: 26px;
    /* Knock the badge out to white so it reads on the darkened photo. */
    filter: brightness(0) invert(1);
  }

  .dots { display: flex; gap: 11px; margin-bottom: 26px; }
  .dots span { width: 11px; height: 11px; border-radius: 50%; }
  .dots span:nth-child(1) { background: #F65472; }
  .dots span:nth-child(2) { background: #69CFED; }
  .dots span:nth-child(3) { background: #8CC63E; }
  .dots span:nth-child(4) { background: #9A50A5; }
  .dots span:nth-child(5) { background: #F07F1B; }

  .headline {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 62px;
    line-height: 1.05;
    color: #fff;
    letter-spacing: -0.5px;
  }

  .sub {
    margin-top: 16px;
    font-size: 27px;
    font-weight: 700;
    color: #69CFED;
  }

  .kicker {
    margin-top: 10px;
    font-size: 23px;
    font-weight: 600;
    color: rgba(255,255,255,0.82);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="photo-bg">
      <img src="../photos/2026-aerial.jpg" alt="">
    </div>
    <div class="overlay"></div>

    <div class="stack">
      <img class="badge" src="../logo-badge.svg" alt="Madison Good Neighbor Gathering">
      <div class="dots"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="headline">Thank you, Madison</div>
      <div class="sub">Brittingham Park &middot; September 13, 2026</div>
      <div class="kicker">Back in the park next September</div>
    </div>
  </div>
</body>
</html>
