<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>GNG 2026 — Square Post</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; overflow:hidden; background:#1A1A2E; font-family:'Nunito',sans-serif; }

  .canvas {
    width:1080px; height:1080px; position:relative; overflow:hidden;
    background: linear-gradient(145deg, #1A1A2E 0%, #2a1a4e 100%);
  }

  /* Background blobs */
  .blob { position:absolute; border-radius:50%; filter:blur(0px); opacity:0.18; }
  .b1 { width:520px; height:520px; background:#F65472; top:-120px; right:-100px; }
  .b2 { width:400px; height:400px; background:#F07F1B; bottom:-80px; left:-80px; }
  .b3 { width:300px; height:300px; background:#8CC63E; bottom:100px; right:-60px; }
  .b4 { width:200px; height:200px; background:#FFDE59; top:300px; left:-40px; }

  /* Confetti dots */
  .dot { position:absolute; border-radius:50%; }

  /* Stars */
  .star { position:absolute; color:#FFDE59; font-size:28px; opacity:0.9; }
  .star.pink { color:#F65472; }
  .star.green { color:#8CC63E; }
  .star.orange { color:#F07F1B; }

  /* Main content */
  .content {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:60px;
    text-align:center;
  }

  .free-badge {
    background:#8CC63E; color:#fff;
    font-family:'Baloo 2',cursive; font-weight:800; font-size:26px;
    padding:8px 28px; border-radius:50px;
    letter-spacing:0.05em; text-transform:uppercase;
    margin-bottom:32px;
    box-shadow: 0 4px 20px rgba(140,198,62,0.4);
  }

  .logo-wrap { margin-bottom:36px; }
  .logo-wrap img { width:520px; height:auto; filter:drop-shadow(0 4px 24px rgba(0,0,0,0.4)); }

  .tagline {
    font-family:'Baloo 2',cursive; font-weight:700; font-size:34px;
    color:rgba(255,255,255,0.88); line-height:1.3; margin-bottom:24px;
    max-width:780px;
  }

  .chips {
    display:flex; flex-wrap:wrap; justify-content:center; gap:14px;
    margin-bottom:20px;
  }
  .chip {
    font-family:'Baloo 2',cursive; font-weight:700; font-size:28px;
    padding:12px 30px; border-radius:50px;
    display:flex; align-items:center; gap:10px;
  }
  .chip-pink  { background:#F65472; color:#fff; box-shadow:0 4px 20px rgba(246,84,114,0.45); }
  .chip-blue  { background:#3DAAC8; color:#fff; box-shadow:0 4px 20px rgba(61,170,200,0.45); }
  .chip-green { background:#8CC63E; color:#fff; box-shadow:0 4px 20px rgba(140,198,62,0.45); }
  .chip-yellow{ background:#FFDE59; color:#1A1A2E; box-shadow:0 4px 20px rgba(255,222,89,0.45); }

  .photo-strip {
    display:flex; gap:10px; width:100%; margin-bottom:20px;
  }
  .photo-strip img {
    flex:1; height:160px; object-fit:cover; border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,0.4);
  }

  .url {
    font-family:'Nunito',sans-serif; font-weight:800; font-size:26px;
    color:rgba(255,255,255,0.55); letter-spacing:0.04em;
  }
</style>
</head>
<body>
<div class="canvas">
  <!-- Blobs -->
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>

  <!-- Dots -->
  <div class="dot" style="width:18px;height:18px;background:#FFDE59;top:80px;left:120px;opacity:0.7;"></div>
  <div class="dot" style="width:12px;height:12px;background:#F65472;top:160px;left:340px;opacity:0.6;"></div>
  <div class="dot" style="width:22px;height:22px;background:#8CC63E;top:60px;right:280px;opacity:0.65;"></div>
  <div class="dot" style="width:14px;height:14px;background:#F07F1B;bottom:180px;left:220px;opacity:0.6;"></div>
  <div class="dot" style="width:20px;height:20px;background:#3DAAC8;bottom:100px;right:180px;opacity:0.65;"></div>
  <div class="dot" style="width:10px;height:10px;background:#FFDE59;top:480px;left:60px;opacity:0.7;"></div>
  <div class="dot" style="width:16px;height:16px;background:#F65472;top:520px;right:55px;opacity:0.6;"></div>

  <!-- Stars -->
  <span class="star" style="top:70px;left:70px;">★</span>
  <span class="star pink" style="top:120px;right:100px;font-size:22px;">✦</span>
  <span class="star green" style="bottom:140px;left:80px;font-size:20px;">★</span>
  <span class="star orange" style="bottom:80px;right:120px;font-size:26px;">✦</span>
  <span class="star" style="top:320px;left:45px;font-size:18px;">✦</span>
  <span class="star pink" style="top:360px;right:42px;font-size:16px;">★</span>

  <div class="content">
    <div class="free-badge">🎉 100% Free · All Ages</div>
    <div class="logo-wrap">
      <img src="../logo.svg" alt="Madison Good Neighbor Gathering">
    </div>
    <p class="tagline">Your District 13 neighbors are throwing a party.<br>And everyone's invited.</p>
    <div class="chips">
      <div class="chip chip-pink">📅 Sunday, Sept 13, 2026</div>
      <div class="chip chip-blue">⏰ 12 – 4 PM</div>
      <div class="chip chip-green">🌿 Brittingham Park</div>
    </div>
    <div class="photo-strip">
      <img src="../photos/community-dance.jpg" alt="Community dancing at last year's event">
      <img src="../photos/food-truck.jpg" alt="Food trucks at the festival">
      <img src="../photos/kids-crown.jpg" alt="Kids having fun">
    </div>
    <div class="url">madisongoodneighborgathering.org</div>
  </div>
</div>
</body>
</html>
